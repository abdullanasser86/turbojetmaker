    deg (from meridional), +/-3; TurboFlow sign convention positive'
  trailing_edge_angle_deg: 'digitized: [L07] Fig. 2 midspan last point ~-21 deg; hub/shroud
    -13/-35; UNCERTAIN whether these are trailing-edge values'
  length_meridional_m: 'digitized: [L07] Fig. 2 meridional-length axis: hub ~40, shroud
    ~20 (units assumed mm) -> mean ~30 mm'
  length_axial_m: 'assumption: not published; ~0.6 x tip radius, same ratio as TurboFlow''s
    example impeller (45/71.5)'
  area_throat_ratio: 'assumption: not published; estimate A_throat ~ A_inducer*cos(beta1b,mid=42
    deg)*(1-0.05 blade blockage) = 0.70. Used only by the throat-choke criterion'
