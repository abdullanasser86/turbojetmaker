# JetCat micro-turbojet manufacturer data (ISA sea-level static, maximum rpm).
#
# PROVENANCE / STATUS: UNVERIFIED.
# Retrieved 2026-10-24 via web-search result extracts of jetcat.de product pages. The pages
# themselves could not be opened from the development container (network policy), so every
# number below is second-hand and must be checked against the official datasheets before it is
# treated as reference data. Internal consistency check that WAS done: listed fuel flow x an
# assumed kerosene density of 0.80 kg/L reproduces the listed SFC within 0-3 %
# (scripts/phase1/jetcat_inverse.py prints this).
#
# Units: thrust N, mass flow kg/s, fuel flow ml/min (full load), SFC kg/(N h), rpm 1/min,
# EGT deg C (range as listed), mass g, dimensions mm.
# `null` = not in the retrieved extract.

