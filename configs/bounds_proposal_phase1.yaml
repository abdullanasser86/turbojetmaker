# PROPOSAL (Phase 1) for cycle-level design-variable bounds. NOT ACTIVE until the user
# confirms; then the agreed values move into configs/default.yaml `bounds:`.
#
# Evidence available in Phase 1 is thin (see docs/PHASE1_REPORT.md):
#   [R]  Micro-turbojet review (Sharif Univ. of Technology / Bu-Ali Sina Univ., J. Solid & Fluid
#        Mechanics), scope statement from its abstract: thrust < 1000 N, diameter < 300 mm,
#        compressor pressure ratio < 5, fuel flow < 2500 g/min. Full engine table NOT yet read.
#   [J]  JetCat datasheets, 5 engines 63-425 N (validation/cases/jetcat_datasheets.yaml;
#        web-search extracts, unverified).
#   [I]  Phase 1 inverse analysis (validation/phase1/jetcat_inverse.csv).

bounds:
  cycle_pressure_ratio:
    lower: 2.0
    upper: 4.5
    source: "[J] 2.5-3.9 for 63-425 N; [R] all engines < 5. Upper end kept below 5 for single-stage centrifugal."
  air_mass_flow_kg_s:
    lower: 0.10
    upper: 1.8
    source: "[J] 0.16-0.67 kg/s for 63-425 N (specific thrust ~390-630 N s/kg) extrapolated to 50-1000 N"
  tit_K:
    lower: 1000.0
    upper: 1250.0
    source: "[I] implied TIT 1090-1240 K for P62, P160 (datasheet-consistent) and P220 (no EGT listed) at eta_b = 0.95. Upper limit must come from turbine material data (Phase 3) -- PROVISIONAL"
  shaft_speed_rpm:
    lower: 60000.0
    upper: 200000.0
    source: "[J] max rpm 98k-185k (larger engines slower). Not a cycle variable: set by impeller tip speed + size in Phase 2/3"
