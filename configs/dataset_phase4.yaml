# Phase 4 dataset (scope approved by the user 2026-10-25): 2000 designs, 4 operating points each.
# Generator: turboml/data/generator.py, run with scripts/phase4/generate_dataset.py (resumable, parallel).

name: phase4_v1
n_designs: 2000
seed: 20261024            # same project seed as configs/default.yaml
sampler: sobol_scrambled  # scipy.stats.qmc.Sobol(scramble=True, seed); first n_designs points of a 2^11 sequence

# Design variables: bounds from configs/bounds.yaml (each with its source there). Scale: how a unit Sobol
# coordinate maps to the bound ("log" for mass flow, which spans a factor ~24).
design_variables:
  cycle_pressure_ratio: {key: pr_c, scale: linear}
  air_mass_flow_kg_s:   {key: W_air_kg_s, scale: log}
  shaft_speed_rpm:      {key: n_rpm, scale: linear}
  tit_K:                {key: tit_K, scale: linear}
  turb_flow_coefficient:    {key: turb_phi, scale: linear}
  turb_loading_coefficient: {key: turb_psi, scale: linear}
  turb_reaction:            {key: turb_reaction, scale: linear}

# Design point flight condition (sea-level static, ISA).
design_condition: {alt_m: 0.0, mach: 0.0, dT_isa_K: 0.0}

# Stored operating points per design (user decision 2026-10-25). n_frac = fraction of design shaft speed.
points:
  - {name: design,         n_frac: 1.0,  alt_m: 0.0,    mach: 0.0}
  - {name: cruise_M05_3km, n_frac: 1.0,  alt_m: 3000.0, mach: 0.5}
  - {name: part_speed_80,  n_frac: 0.8,  alt_m: 0.0,    mach: 0.0}
  - {name: idle_35,        n_frac: 0.35, alt_m: 0.0,    mach: 0.0}

# Compressor calibration uncertainty (configs/components/kj66_compressor_calibration.yaml `phase4_sampling`):
# this fraction of designs gets (delta_sigma, diffuser_cf) uniform in the inflated band; the rest the nominal values.
calibration_sampling: configs/components/kj66_compressor_calibration_v1_xiang90k.yaml  # frozen, superseded by R1 (D-059)

# Frozen held-out test set (user decision 2026-10-25): fraction of design ids, chosen once from the seed and
# written to data/splits/phase4_v1_split.csv before any surrogate work. Never used for training or tuning.
test_fraction: 0.15

# pyCycle-CEA cross-check (CLAUDE.md rules): random fraction of the successfully designed engines, at the design point.
crosscheck_fraction: 0.02

output_dir: datasets/phase4_v1   # git-ignored; the dataset card and split are committed
