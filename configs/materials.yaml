# Turbine materials and creep-check settings (turboml/physics/creep.py, turboml/physics/mechanical.py).
#
# Source of all alloy data: Nickel Development Institute publication No. 393, "High-Temperature,
# High-Strength Nickel Base Alloys" (1984, with 1995 supplement): Table 1 (density, condition; p. 4-5),
# Table 9 (100 h rupture strength, p. 14), Table 10 (1000 h rupture strength, p. 15), transcribed in
# validation/cases/ni393_cast_rupture.csv. "Typical" values, not design minima (No. 393, p. 2).
#
# Feasibility (user decision 2026-10-25): a design is infeasible only if the selected material fails the
# creep check at the required life. Default material first; if it fails, the premium material ("premium
# material required"); if both fail, the design is infeasible (kept in the data, with the active constraint).

default_turbine_material: in713c
premium_turbine_material: marm247

# PRELIMINARY-DESIGN CHOICES (user decision 2026-10-25), not requirements from a standard:
design_life_h:        {value: 100.0, kind: preliminary_design_choice, source: "user decision 2026-10-25"}
stress_safety_factor: {value: 1.5,   kind: preliminary_design_choice, source: "user decision 2026-10-25 (on stress)"}
blade_taper_factor:
  value: 1.0
  kind: assumption
  source: "K in sigma_c = K rho omega^2 A / 2 pi; 1 = untapered constant-section blade (conservative upper bound). Dataset stores sigma_c per unit K, so feasibility can be recomputed with a sourced K."

# Nozzle-guide-vane hot streak: T_metal = TIT + PF (TIT - T3), PF = combustor exit pattern factor
# (definition: DePaola 2020 Sec. 2.5.2, per user; Lefebvre & Ballal, Gas Turbine Combustion).
# NOT SOURCED YET: no verifiable typical range was found (web search 2026-10-25 found definitions and single
# examples only). Until it is, the NGV check reports PF_max = the largest pattern factor the vanes survive;
# designs failing even at PF = 0 are infeasible.
combustor_pattern_factor:
  value: null
  kind: missing
  source: "NEEDED: cited range for small annular combustors (DePaola 2020 Sec. 2.5.2; Lefebvre & Ballal)"

materials:
  in713c:
    name: "Alloy 713C (cast nickel superalloy), as cast"
    grade: default
    density_kg_m3: {value: 7910.0, source: "NiDI No. 393 Table 1, p. 5: 7.91 g/cm3 (0.286 lb/in3)"}
    rupture_data: {alloy_key: in713c, source: "NiDI No. 393 Table 9 (p. 14) and Table 10 (p. 15); 760-1093 C (100 h), 760-982 C (1000 h)"}
  marm247:
    name: "MAR-M 247 (cast nickel superalloy, equiaxed; data from test bars machined from blades, 870 C/16 h/AC)"
    grade: premium
    density_kg_m3: {value: 8530.0, source: "NiDI No. 393 Table 1, p. 5: 8.53 g/cm3 (0.308 lb/in3)"}
    rupture_data: {alloy_key: marm247, source: "NiDI No. 393 Table 9 (p. 14) and Table 10 (p. 15); 760-1038 C (100 h), 871-982 C (1000 h)"}
