# Calibrated effective parameters of the TurboML centrifugal-compressor meanline model, from the KJ-66.
# STATUS: PROVISIONAL DEFAULTS for every new compressor design (user decision 2026-10-25, item 1).
# Recalibrate when new data arrive (DePaola 2020, Murray 2009 thesis, Xiang 2015 thesis are requested).
# If Xiang's geometry makes these factors unnecessary, switch to the geometry-based model and report the change.
#
# Produced by scripts/phase2/kj66_compressor_validation.py (fit) and
# scripts/phase3/compressor_calibration_band.py (uncertainty band).
#
# What the factors are: EFFECTIVE values. delta_sigma corrects the Wiesner slip factor (it absorbs the
# unknown real backsweep/slip of the KJ-66 wheel); diffuser_cf (~19x a plain vaneless-diffuser value)
# absorbs the unmodelled wedge-vane diffuser and 90-degree-turn losses. Applying them to other designs
# assumes those designs have KJ-66-like losses. That is the provisional assumption.

model: turboml.physics.compressor.CentrifugalCompressor (slip wiesner, incidence blade_relative, loss_convention oh_aungier)
geometry: configs/components/kj66_compressor.yaml

delta_sigma:
  value: -0.1041
  kind: calibrated
  slip_factor_on_kj66: 0.7031
  sigma_1: 0.0074
  band_2sigma: [-0.1189, -0.0893]
  band_inflated: [-0.1448, -0.0634]   # statistical + model-form, see `band_inflation` below
diffuser_cf:
  value: 0.0937
  kind: calibrated
  sigma_1: 0.0039
  band_2sigma: [0.0860, 0.1015]
  band_inflated: [0.0724, 0.1150]
parameter_correlation: -0.14

fit:
  method: "least squares (scipy least_squares, bounds delta_sigma [-0.25, 0.10], Cf [0.002, 0.5]); residuals PR/PR_meas - 1 and eta/eta_meas - 1"
  band_method: "cov = s^2 (J^T J)^-1 from the LSQ Jacobian, s^2 = RSS/(n-p), n = 10, p = 2; residual rms 0.0123"
  band_caveat: "STATISTICAL band from 10 digitized points only. It excludes model-form error: the held-out speeds show PR errors up to 4.6 % and efficiency up to 3.1 pts (docs/VALIDATION.md)."
  source: "Murray 2009 MSc thesis (Queen's University), engine-test MEASURED data as plotted in Xiang, Schlueter & Duan 2016, Proc IMechE G, doi:10.1177/0954410016644632, Figs 6-7; digitized by TurboML (validation/cases/kj66_compressor_exp_murray2009.csv)"
  # calibration/validation split (also in docs/VALIDATION.md). Validation errors are only ever reported
  # on the held-out speeds.
  calibration_points: {speed_rpm: [90000], rows: "5 pressure-ratio + 5 efficiency rows at 90 krpm (m = 0.140-0.155 kg/s)"}
  validation_points: {speed_rpm: [70000, 80000, 100000, 110000], rows: "all other measured rows of the same file"}

band_inflation:
  # User decision 2026-10-25: widen the statistical band until >= 95 % of the held-out measured points lie inside
  # the model's prediction envelope (min/max over a 3 x 3 grid of the band, evaluated at each point's mass flow and
  # speed). Common factor k on both 2-sigma half-widths; smallest k on the grid {1, 2, 2.25, 2.5, 2.75, 3, ...}
  # with coverage >= 95 %. scripts/phase4/compressor_band_inflation.py -> validation/phase4/compressor_band_*.
  method: "band = centre +- k * (2-sigma half-width); envelope over 3 x 3 grid; measured value inside [min, max] prediction"
  k: 2.75
  coverage_held_out: "34/34 (k = 2.5: 32/34 = 94 %)"
  caveat: "the held-out points size this band, so they are no longer independent evidence for its width (they still are for the point calibration)"

phase4_sampling:
  # Carry the factors as uncertain parameters: a subset of the dataset samples them inside the band.
  fraction_of_designs: 0.2   # approved by the user 2026-10-25
  distribution: uniform
  range: band_inflated
  independent: true          # correlation -0.14 neglected
