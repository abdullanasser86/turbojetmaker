# KJ-66 axial turbine stage (single stage, NGV + rotor) for the Murray (2009) KJ-66 validation case (D-061).
#
# kind: published  = printed in the source below
#       calibrated, not measured = fitted to Murray's MEASURED turbine maps (scripts/phase4/turbine_calibration_murray.py);
#                    NOT a measured dimension of any engine. Keep this label wherever the value is used.
#       assumption   = engineering choice
#
# [XU21] Xu, Wu, Liu & Piao, GPPS-TC-2021-0117, GPPS Xi'an 2021, CC BY 4.0, "New KJ66" micro turbine engine.
#        CAUTION (user, 2026-10-27): a REDESIGNED one-spool KJ66 derived from Teixeira et al. (GT2018); its compressor
#        differs from Xiang's. Treat the counts as "a published KJ66 variant", not certain for Murray's ArtesJet KJ-66.
# [HOB]  hobby build sources: 66 mm turbine wheel, NGV and wheel in Inconel 713C (supporting evidence only).

rotor_tip_radius_m: {value: 0.033, kind: published, source: "[XU21] rotor diameter 66 mm; [HOB] 66 mm wheel"}
n_ngv: {value: 18, kind: published, source: "[XU21]"}
n_rotor: {value: 24, kind: published, source: "[XU21]"}
tip_clearance_height_ratio: {value: 0.01, kind: published, source: "[XU21] tip clearance 1 % of blade height"}
design_speed_rpm: {value: 80000, kind: published, source: "[XU21] design speed of the redesigned variant (Murray's KJ-66 runs to 120 krpm); reference only, not used"}
engine_length_m: {value: 0.240, kind: published, source: "[XU21]"}
engine_diameter_m: {value: 0.108, kind: published, source: "[XU21]"}
engine_mass_kg: {value: 0.93, kind: published, source: "[XU21]"}
annulus: {value: cylindrical, kind: assumption, source: "same hub and tip radius for NGV and rotor (no flare published)"}
rotor_le_rule: {value: zero_incidence_at_murray_D10, kind: assumption, source: "rotor metal inlet angle = relative inflow angle at Murray App D point D.10 (120 krpm)"}

# CALIBRATED, NOT MEASURED (scripts/phase4/turbine_calibration_murray.py, fit F: Murray Fig 5.16 corrected flow on
# lines 26/38/50/62 krpm + App D exit velocity V5 on D.1, D.3, ..., D.15; validation/phase4/turbine_calibration_murray.yaml).
# Identifiability (D-062): the flow map alone fixes only the NGV throat area (flow-only fit: hub/tip 0.52 +- 0.60);
# hub/tip comes from V5 under the ASSUMPTION that station 5 is the rotor exit plane. The Jacobian sigmas are not
# meaningful (condition number 1e8, hub/tip~rotor angle correlation -1.0): the ranges below are the hub/tip profile
# (delta RSS <= s^2) with the angles re-fitted along it; above hub/tip ~0.745 the model cannot reach the measured
# operating points (upper edge = model limit, not data).
hub_tip: {value: 0.743, kind: "calibrated, not measured", range_profile: [0.65, 0.745]}
ngv_gauging_deg: {value: 64.8, kind: "calibrated, not measured", range_profile: [64.8, 71.1]}
rotor_gauging_deg: {value: 43.6, kind: "calibrated, not measured", range_profile: [36.1, 43.6]}
rotor_le_deg: {value: 27.33, kind: "derived from the calibrated values (rotor_le_rule)"}
# Consequences (fit F): blade height 8.5 mm, hub diameter 49 mm, tip clearance 0.085 mm; NGV choked at 120 krpm.
# Efficiency is NOT matched: model - Murray = +11.2 pts mean over all lines (+10.9 at <= 44 krpm corrected).
# Alternative (fit Q, flow map only; NOT adopted): hub/tip 0.52 +- 0.60, NGV 70.9 deg, rotor 67.9 deg -- matches the
# flow map within +-4 % but the exit velocity V5 by -47 %. Used as a sensitivity case in the idle-EGT replica, where it
# reproduces Murray's low-speed TIT (D-062, docs/VALIDATION.md round 5).
# Joint refit (geometry + k_loss, D-068; calibrated, not measured; validation/phase4/turbine_joint_refit.yaml):
#   near T-A: hub/tip 0.735, NGV 63.9, rotor 45.0 deg, k_loss 1.95 (V5 -5 %)  <- consistent with the exit velocity
#   middle:   hub/tip 0.649, NGV 67.8, rotor 54.3 deg, k_loss 2.33 (lowest RSS; V5 -29 %)
#   near T-B: hub/tip 0.482, NGV 71.0, rotor 67.9 deg, k_loss 2.10 (V5 -51 %)
# The maps alone do not identify the geometry; the adopted values above (fit F / T-A) are unchanged.
