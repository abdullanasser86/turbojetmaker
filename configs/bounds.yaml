# Design-variable bounds (ACTIVE). Loaded by turboml.config via `bounds_file:` in default.yaml.
#
# Every bound states its source. `{}` = not yet set (component variables are filled in as the
# Phase 2/3 component models define them). Sources:
#   [U]   User decision 2026-10-24 (pre-Phase 2 instructions), based on the documents below.
#   [R]   Anjomrouz, Ghadiri & Imani (2023), J. Solid Fluid Mech. 13(5):59-76, Table 3
#         -> validation/cases/review_engine_table.csv (109 engines, 15.6-979 N)
#   [JC]  JetCat PRO Engines catalog 2024 -> validation/cases/jetcat_pro_catalog_2024.csv
#   [JD]  JetCat P500-PRO / P550-PRO datasheets V1.1 02/2023
#   [U2]  User decision 2026-10-25 (pre-Phase 3 instructions).
#   [T]   Textbook range (see entry), provisional until confirmed.
#   [D]   DePaola, AFIT thesis 2020 (as summarised by the user; thesis not yet available to us)
#
# Database check (scripts/data/derive_bounds.py; numbers for engines >= 50 N unless stated):
#   PR: 2.0-4.7 (28 engines report PR; P20-SX at 24 N has 1.5).
#   Specific thrust Fn/W: 352-634 N s/kg (18 engines); small engines (<250 N) 352-511.
#   Max rpm: 205 krpm at 50 N ... 61.5 krpm (AMT Nike 784 N, JetCat P1000 1100 N);
#            fit rpm ~ 7.3e5 * F^-0.343 -> 190 krpm @ 50 N, 68 krpm @ 1000 N.
#   Max EGT: 650-875 C (AMT Titan/Nike 875 C).

bounds:
  cycle_pressure_ratio:
    lower: 2.0
    upper: 5.0
    source: "[U] from [R] ('PR < 5' for < 1000 N; Table 3 max 4.7) and JetCat P90 ~2.35 (user). Database: 2.0-4.7 for >= 50 N."
  air_mass_flow_kg_s:
    lower: 0.08
    upper: 1.9
    source: "[U] from [JD] P500 0.90 kg/s @ 500 N, P550 0.93 @ 550 N; 50 N needs ~0.09 and 1000 N ~1.8 at 550-600 N s/kg. Database: engines < 250 N have 352-511 N s/kg -> 50 N needs 0.10-0.14 kg/s (inside bound)."
  shaft_speed_rpm:
    lower: 50000.0
    upper: 220000.0
    source: "[U] P500/P550 80-83 krpm, P220 117 krpm, P80 125 krpm, 50 N engines ~160-200 krpm. Database: >= 50 N engines 61.5-205 krpm."
  tit_K:
    lower: 1000.0
    upper: 1350.0
    source: "[U2] User decision 2026-10-25 (pre-Phase 3): raised from 1250 K so AMT-class engines ([R]: EGT up to 875 C = 1148 K, TIT above that) stay in the sampled space. TIT feasibility is a MATERIAL constraint (configs/materials.yaml): designs above the selected material's limit are infeasible, not excluded from sampling. Lower bound from JetCat EGT 480-750 C (TIT > EGT)."
  # --- component variables -------------------------------------------------------------
  # Derived in the Phase 3 design mode (turboml/physics/engine.py), NOT independent design variables:
  #   impeller tip radius (from the target PR), inducer radii and exit width (KJ-66 flow coefficients),
  #   turbine mean radius and blade heights (from phi, psi, work and speed), nozzle area (from the design flow).
  turb_flow_coefficient:
    lower: 0.35
    upper: 0.9
    source: "[T] PROVISIONAL: usual axial-turbine stage range (Smith 1965 chart as reproduced in Dixon & Hall, Ch. 4); the Phase 3 verification of the fast turbine model covers exactly this range"
  turb_loading_coefficient:
    lower: 0.9
    upper: 2.2
    source: "[T] PROVISIONAL, as above; verified range of the fast turbine model"
  turb_reaction:
    lower: 0.2
    upper: 0.6
    source: "[T] PROVISIONAL, as above; verified range of the fast turbine model"
  # Phase 4 option C (user decision 2026-10-25): sampled instead of shaft_speed_rpm / turb_flow_coefficient in
  # dataset phase4_v2; shaft speed and flow coefficient are then derived by the sizing.
  impeller_tip_speed_m_s:
    lower: 350.0
    upper: 500.0
    source: "upper: user decision 2026-10-25 (<= 500 m/s, inside the 400-550 m/s structural range for turbocharger-type impellers, DePaola 2020 Sec. 2.4.3 [ASSUM]). lower: DERIVED from the Phase 4 sizing scan of the KJ-66-like family: the most efficient wheel reaches PR 2.0 (lowest sampled PR) at ~355-360 m/s (PR 1.8 at 327 m/s, PR 2.2 at 386 m/s, W = 0.1 kg/s); 350 m/s keeps the whole PR >= 2 band reachable"
  turb_hub_tip_ratio:
    lower: 0.5
    upper: 0.95
    source: "user decision 2026-10-25: rotor-exit hub/tip ratio inside TurboFlow's recommended range [0.5, 0.95] (turboflow geometry_model check_turbine_geometry)"
  # Phase 4 candidates (bounds still to be set with sources): impeller blade count, backsweep, diffuser
  # radius ratio, tip clearance, turbine aspect ratio and tip clearance.
  imp_blade_count: {integer: true}
  imp_backsweep_deg: {}
  diffuser_radius_ratio: {}
  imp_tip_clearance_m: {}

# Constraints that come with the bounds (merged into `constraints:`).
constraints:
  max_impeller_tip_speed_m_s:
    value: 500.0
    source: "[U] / [D] Sec. 2.4.3: turbocharger-type impellers typically limited to 400-550 m/s. Configurable."
